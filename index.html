<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 Drill 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        #haed{
            border-radius: 45px;
        }
        
         #calcula{
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            margin-top: 167px;
            text-decoration-color: aqua;
        }

        h1, h3{
            font-family: Montserrat Sans;
        }

        p{
            font-family: Cascadia Code;
        }
        
    </style>
</head>
<body>
    <div class="container bg-secondary" id="calcula">
        <div class="container bg-dark" id="haed">
            <h1 class="fst-italic text-light" id="head1"><b>Basic Calculator</b></h1>
        </div>

        <h3>
          Click/Tap the button to display the sum of two numbers or adding two numbers
        </h3>

        <br>
        <br>

        <p id="result1">
          What is the sum of <b>50 + 17?</b>
        </p>

        <br>
        <br>

        <button type="button" onclick="document.getElementById('result1').innerHTML=answer1;" class="btn btn-dark text-light">
          
          <b>Reveal Answer</b>
        
        </button>

        <br>
        <br>

    </div>

    <script>

        var $head1 = "Basic Calculator";

        var num1 = 50

        var num2 = 17

        var answer1 = "The answer is " + (num1 + num2) + "!";
      
    </script>

</body>
</html>
